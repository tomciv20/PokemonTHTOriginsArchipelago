# Your player/slot name - CHANGE THIS. It must be unique in the multiworld
# and is what you type into the BizHawk Client when connecting.
name: YourNameHere

description: Default Pokemon THT Origins Template

game: Pokemon THT Origins
requires:
  version: 0.6.0

Pokemon THT Origins:
  progression_balancing:
    normal: 50

  accessibility:
    full: 50
    minimal: 0

  goal:
    # ghetsis: Defeat Jonah (Ghetsis) to win.
    ghetsis: 50

  # Which groups of locations are checks. Turn groups off for a shorter game (at least one must stay on).
  # All on = 511 checks. Items on the ground = 277, hidden items = 131, NPC gifts = 103.
  include_overworld_items:
    true: 50
    false: 0

  include_hidden_items:
    true: 50
    false: 0

  include_npc_gifts:
    true: 50
    false: 0

  local_items:
    []

  non_local_items:
    []

  start_inventory:
    {}

  start_hints:
    []

  start_location_hints:
    []

  exclude_locations:
    []

  priority_locations:
    []

  item_links:
    []
