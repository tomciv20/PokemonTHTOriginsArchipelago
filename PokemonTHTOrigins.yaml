# Your player/slot name - CHANGE THIS. It must be unique in the multiworld
# and is what you type into the BizHawk Client when connecting.
name: YourNameHere

description: Default Pokemon THT Origins Template

game: Pokemon THT Origins
requires:
  version: 0.6.0

Pokemon THT Origins:
  progression_balancing:
    normal: 50

  accessibility:
    full: 50
    minimal: 0

  goal:
    # ghetsis: Defeat Jonah (Ghetsis) to win.
    ghetsis: 50

  # Which groups of locations are checks. Turn groups off for a shorter game (at least one must stay on).
  # With the defaults below you get 369 checks: items on the ground = 187, hidden items = 100, NPC gifts = 82.
  include_overworld_items:
    true: 50
    false: 0

  include_hidden_items:
    true: 50
    false: 0

  include_npc_gifts:
    true: 50
    false: 0

  # Postgame areas (Routes 11 to 15, Undella Town, Giant Chasm, Abyssal Ruins, Abundant Shrine, Challenger's Cave,
  # Battle Company, ...) can't be reached until you have finished the story. Off = those checks are left out.
  # On = they exist (+142 checks) but only hold filler items.
  include_postgame_checks:
    true: 0
    false: 50

  local_items:
    []

  non_local_items:
    []

  start_inventory:
    {}

  start_hints:
    []

  start_location_hints:
    []

  exclude_locations:
    []

  priority_locations:
    []

  item_links:
    []
